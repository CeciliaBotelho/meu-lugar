  <title>Cantinho da Ce</title>
  <meta name="description" content="Cantinho da Ce — alimentação, treinos, ciclo e diário, salvos só no seu aparelho.">
  <meta name="theme-color" content="#faf7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cantinho da Ce">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" data-action="go" data-tab="home" aria-label="Ir para o início">
        <span class="brand-name">Cantinho <span class="brand-da">da</span> Ce</span><span class="brand-bow">🎀</span>
      </button>
      <button class="icon-btn" data-action="open-settings" aria-label="Ajustes e backup"><svg class="gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="loading">Carregando seu cantinho… 🌸</div>
    </main>

    <nav class="tabbar" aria-label="Navegação principal">
      <button class="tab" data-action="go" data-tab="home"><span class="tab-ico"><svg class="tab-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg></span><span class="tab-lbl">Início</span></button>
      <button class="tab" data-action="go" data-tab="food"><span class="tab-ico"><svg class="tab-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l-1.2 16.2A2 2 0 0 1 13.8 21h-3.6a2 2 0 0 1-2-1.8L7 3Z"/><path d="M6.5 8h11"/><path d="M14 3l1-2"/></svg></span><span class="tab-lbl">Alimentação</span></button>
      <button class="tab" data-action="go" data-tab="workouts"><span class="tab-ico"><svg class="tab-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span><span class="tab-lbl">Treinos</span></button>
      <button class="tab" data-action="go" data-tab="cycle"><span class="tab-ico"><svg class="tab-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></span><span class="tab-lbl">Meu Ciclo</span></button>
      <button class="tab" data-action="go" data-tab="history"><span class="tab-ico"><svg class="tab-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><span class="tab-lbl">Histórico</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="fx-root" aria-hidden="true"></div>
  <div id="print-root"></div>

  <noscript>O Cantinho da Ce precisa de JavaScript ativado. 💗</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
